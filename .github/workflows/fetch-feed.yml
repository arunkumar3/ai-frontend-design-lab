# Fetches this week's TMDB releases on a GitHub runner, where the network is
# open — the development sandbox's egress proxy blocks `api.themoviedb.org`,
# but allows git transport to this repo. Unlike the poster harvest, this
# writes straight to a tracked file: HANDOFF §8 decided the weekly run
# publishes static data, committed here, rather than the page fetching TMDB
# itself at runtime.
#
# Needs a repository secret named TMDB_TOKEN — a TMDB v4 read access token
# (themoviedb.org -> Settings -> API -> "API Read Access Token"). Until that
# secret exists, this workflow fails fast with instructions instead of
# failing deep inside the fetch script.
name: fetch-feed
on:
  workflow_dispatch:
  schedule:
    # The target is Friday 00:00 IST — Thursday afternoon for the US side of the
    # group, midnight-into-Friday for the India side, the same instant.
    #
    # A single cron at that instant does not reach it. GitHub's scheduled events
    # are best effort and get delayed or dropped outright on a low-traffic repo:
    # the 2026-08-27 18:30 firing was delivered at 2026-08-28 02:14 UTC, 7h44m
    # late and hours after the group had already looked. So attempt it three
    # times on Thursday and let whichever lands first do the work.
    #
    # This is only safe because the run is idempotent. All three share one UTC
    # date, so they compute the same window, and fetch-feed.mjs leaves the file
    # untouched when the release set has not changed — the later attempts commit
    # nothing rather than churning the history.
    - cron: '30 12 * * 4' # Thu 18:00 IST — early, absorbs a long delay
    - cron: '30 16 * * 4' # Thu 22:00 IST — near the target
    - cron: '30 20 * * 4' # Fri 02:00 IST — catch-up if both were dropped
  # workflow_dispatch only registers once this file reaches the default branch — same
  # limitation the poster workflow hit. Until then, a push that touches the trigger
  # marker starts a run from this branch. Bump .feed-trigger to fire it.
  push:
    paths:
      - 'projects/ott-radar/.feed-trigger'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require TMDB_TOKEN
        env:
          TOKEN_SET: ${{ secrets.TMDB_TOKEN != '' }}
        run: |
          if [ "$TOKEN_SET" != "true" ]; then
            echo "::error::TMDB_TOKEN secret is not set. Add a TMDB v4 read access token at" \
                 "Settings -> Secrets and variables -> Actions -> New repository secret," \
                 "named TMDB_TOKEN. Get one free at https://www.themoviedb.org/settings/api" \
                 "(the API Read Access Token, not the v3 key)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: projects/ott-radar/lab
        run: npm install

      - name: Fetch this week's feed
        working-directory: projects/ott-radar/lab
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node scripts/fetch-feed.mjs --out src/data/feed.live.json

      - name: Commit if the feed changed
        run: |
          git config user.name feed-runner
          git config user.email actions@invalid
          git add projects/ott-radar/lab/src/data/feed.live.json
          if git diff --cached --quiet; then
            echo "No change to the feed this run."
          else
            git commit -m "feed: weekly TMDB fetch $(date -u +%Y-%m-%d)"
            git push
          fi
