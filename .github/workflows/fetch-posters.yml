# Fetches poster artwork on a GitHub runner, where the network is open — the
# development sandbox's egress proxy blocks every image host, but allows git
# transport to this repo. The runner pushes its harvest to the transient
# branch `posters-cache-temp`; the sandbox fetches it and deletes the branch,
# so poster bytes never enter any long-lived history (NOTICE keeps its
# hotlink-only stance for the repository).
name: fetch-posters
# workflow_dispatch only registers once this file reaches the default branch;
# until then, a push that touches the trigger marker starts a run from this
# branch. Bump .poster-trigger to fire it.
on:
  workflow_dispatch:
  push:
    paths:
      - '.poster-trigger'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect posters
        run: node lab/scripts/action-fetch-posters.mjs
      - name: Push to transient branch
        run: |
          cd posters-out
          git init -b posters-cache-temp
          git add -A
          git -c user.name=poster-runner -c user.email=actions@invalid \
            commit -m "transient poster cache — fetched on a runner, deleted after pickup"
          git push --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" \
            posters-cache-temp
