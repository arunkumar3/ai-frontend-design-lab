# Deletes the transient poster branch. The sandbox's git proxy only permits
# pushes to the session branch, so the cleanup runs where the branch was made.
name: cleanup-posters
on:
  push:
    paths:
      - '.poster-cleanup'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete transient branch
        run: |
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" \
            --delete posters-cache-temp || echo "already gone"
