# Verifies the TMDB watch-provider ids in src/feed/sources/tmdb.js against
# TMDB's own list for each region. Read-only: prints a report, commits nothing.
#
# Runs here rather than in the sandbox for the same reason fetch-feed does —
# api.themoviedb.org is blocked on the development network, which is exactly
# why those ids went unverified long enough to ship a feed with no Telugu or
# Hindi titles in it.
#
# Bump projects/ott-radar/.probe-trigger to fire it from a branch.
name: probe-providers
on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/ott-radar/.probe-trigger'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Require TMDB_TOKEN
        env:
          TOKEN_SET: ${{ secrets.TMDB_TOKEN != '' }}
        run: |
          if [ "$TOKEN_SET" != "true" ]; then
            echo "::error::TMDB_TOKEN secret is not set."
            exit 1
          fi
      - name: Probe the Streaming Availability API (skipped without a key)
        working-directory: projects/ott-radar/lab
        env:
          STREAMING_API_KEY: ${{ secrets.STREAMING_API_KEY }}
        # Skipped rather than failed while the key is absent: the other probes
        # in this job are still worth running, and a red job for a dependency
        # nobody has signed up for yet is noise.
        run: |
          if [ -z "$STREAMING_API_KEY" ]; then
            echo "STREAMING_API_KEY not set — skipping. Add it under"
            echo "Settings -> Secrets and variables -> Actions to run this."
            exit 0
          fi
          node scripts/probe-streaming-api.mjs

      - name: Probe provider ids
        working-directory: projects/ott-radar/lab
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node scripts/probe-providers.mjs
      - name: Probe a second source for the unplaced titles
        working-directory: projects/ott-radar/lab
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node scripts/probe-second-source.mjs
      - name: Probe digital releases by language
        working-directory: projects/ott-radar/lab
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node scripts/probe-digital.mjs
